<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Nelaa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            cursor: none;
        }
        
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px rgba(255,107,157,0.5);
        }
        
        .lock-screen {
            text-align: center;
            color: #fff;
            opacity: 0;
            animation: fadeInPulse 2s infinite;
            transform: scale(0.8);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .lock-screen.active {
            opacity: 1;
            transform: scale(1);
        }
        
        @keyframes fadeInPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        .code-input {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px 60px;
            margin: 20px 0;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .code-title {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b9d, #c44569, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .code-field {
            background: rgba(0,0,0,0.3);
            border: none;
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            letter-spacing: 8px;
            width: 280px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            caret-color: #ff6b9d;
        }
        
        .code-field::placeholder {
            color: rgba(255,255,255,0.4);
            letter-spacing: 8px;
        }
        
        .glitch {
            position: relative;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch::before {
            animation: glitch-anim 2s infinite linear alternate-reverse;
            color: #ff6b9d;
            left: 2px;
            text-shadow: -2px 0 #c44569;
        }
        
        .glitch::after {
            animation: glitch-anim2 2s infinite linear alternate-reverse;
            color: #ff9ff3;
            right: 2px;
            text-shadow: -2px 0 #ff6b9d;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(42px, 9999px, 44px, 0); transform: skew(0.6deg); }
            5% { clip: rect(17px, 9999px, 52px, 0); transform: skew(0.4deg); }
            10%, 100% { clip: rect(40px, 9999px, 37px, 0); transform: skew(0.2deg); }
        }
        
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 47px, 0); transform: skew(0.8deg); }
            5% { clip: rect(23px, 9999px, 77px, 0); transform: skew(0.2deg); }
            10%, 100% { clip: rect(57px, 9999px, 40px, 0); transform: skew(0.6deg); }
        }
        
        .gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            visibility: hidden;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            padding: 50px;
            align-content: center;
        }
        
        .gallery.active {
            opacity: 1;
            visibility: visible;
        }
        
        .photo-frame {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            transform: scale(0.8) rotateY(20deg);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 35px 80px rgba(0,0,0,0.7);
        }
        
        .photo-frame:hover {
            transform: scale(1.05) rotateY(0deg);
        }
        
        .photo-frame img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        
        .photo-frame:hover img {
            transform: scale(1.1);
        }
        
        .photo-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s ease;
            font-weight: 500;
        }
        
        .photo-frame:hover .photo-label {
            opacity: 1;
            transform: translateY(0);
        }
        
        .surprise-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b9d, #c44569, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            opacity: 0;
            z-index: 10000;
            pointer-events: none;
            animation: gradientShift 2s ease infinite;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
                padding: 30px 20px;
                gap: 20px;
            }
            
            .photo-frame {
                transform: scale(0.9) rotateY(10deg);
            }
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b9d;
            border-radius: 50%;
            animation: particleFloat 8s linear infinite;
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="particles" id="particles"></div>
    
    <div class="lock-screen active" id="lockScreen">
        <div class="code-input">
            <div class="code-title glitch" data-text="UNLOCK NELAA">UNLOCK NELAA</div>
            <input type="text" class="code-field" id="codeInput" maxlength="4" placeholder="____">
        </div>
    </div>
    
    <div class="gallery" id="gallery">
        <div class="photo-frame" data-full="https://images.unsplash.com/photo-1494790108755-2616b612b786?w=1200">
            <img src="https://images.unsplash.com/photo-1494790108755-2616b612b786?w=800&h=600&fit=crop" alt="Nelaa 20">
            <div class="photo-label">Nelaa yang Cantik</div>
        </div>
        
        <div class="photo-frame" data-full="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1200">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=600&fit=crop" alt="Nelaa 20">
            <div class="photo-label">20 Tahun ✨</div>
        </div>
        
        <div class="photo-frame" data-full="https://images.unsplash.com/photo-1524504388940-7b8a6c5e8b53?w=1200">
            <img src="https://images.unsplash.com/photo-1524504388940-7b8a6c5e8b53?w=800&h=600&fit=crop" alt="Nelaa 20">
            <div class="photo-label">Selamat Ulang Tahun!</div>
        </div>
        
        <div class="photo-frame" data-full="https://images.unsplash.com/photo-1558618047-3c8c76bbb17e?w=1200">
            <img src="https://images.unsplash.com/photo-1558618047-3c8c76bbb17e?w=800&h=600&fit=crop" alt="Nelaa 20">
            <div class="photo-label">Paling Spesial</div>
        </div>
        
        <div class="photo-frame" data-full="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200">
            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&h=600&fit=crop" alt="Nelaa 20">
            <div class="photo-label">Forever 20 💕</div>
        </div>
    </div>
    
    <div class="surprise-text" id="surpriseText">
        <div style="font-size: 0.4em; opacity: 0.8; margin-bottom: 20px;">HAPPY</div>
        <div>20th</div>
        <div style="font-size: 0.4em; opacity: 0.8; margin-top: 20px;">NELAA! ✨</div>
    </div>

    <script>
        // Custom cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });

        // Code unlock system - KODE: NEL4 / 20TH / LOVE
        const codeInput = document.getElementById('codeInput');
        const lockScreen = document.getElementById('lockScreen');
        const gallery = document.getElementById('gallery');
        const surpriseText = document.getElementById('surpriseText');
        
        codeInput.addEventListener('input', (e) => {
            if (e.target.value.length === 4) {
                if (e.target.value === 'NEL4' || e.target.value === '20TH' || e.target.value === 'LOVE') {
                    unlock();
                } else {
                    e.target.style.animation = 'shake 0.5s ease-in-out';
                    setTimeout(() => e.target.style.animation = '', 500);
                    e.target.value = '';
                }
            }
        });

        function unlock() {
            lockScreen.classList.remove('active');
            setTimeout(() => {
                lockScreen.style.opacity = '0';
                lockScreen.style.transform = 'scale(0.5)';
                gallery.classList.add('active');
                createParticles();
                showSurprise();
            }, 800);
        }

        // Photo modal
        document.querySelectorAll('.photo-frame').forEach(frame => {
            frame.addEventListener('click', () => {
                const fullImg = frame.dataset.full;
                const img = document.createElement('img');
                img.src = fullImg;
                img.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) scale(0);
                    width: 90vw;
                    max-width: 800px;
                    height: auto;
                    border-radius: 20px;
                    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
                    z-index: 10001;
                    cursor: zoom-out;
                    transition: transform 0.5s ease;
                `;
                document.body.appendChild(img);
                
                setTimeout(() => img.style.transform = 'translate(-50%, -50%) scale(1)', 10);
                
                img.onclick = () => {
                    img.style.transform = 'translate(-50%, -50%) scale(0)';
                    setTimeout(() => img.remove(), 500);
                };
            });
        });

        // Particles explosion
        function createParticles() {
            const particles = document.getElementById('particles');
            for (let i = 0; i < 150; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particles.appendChild(particle);
            }
        }

        // Surprise text animation
        function showSurprise() {
            setTimeout(() => {
                surpriseText.style.opacity = '1';
                surpriseText.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 1200);
            
            setTimeout(() => {
                surpriseText.style.opacity = '0';
                surpriseText.style.transform = 'translate(-50%, -50%) scale(1.2)';
            }, 4000);
        }

        // Auto focus & keyboard
        codeInput.focus();
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && codeInput.value.length === 4) {
                unlock();
            }
        });

        // Shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
