<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelaa 20 - Magic Box ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&family=Dancing+Script:wght@700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: float 6s linear infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
        
        .magic-container {
            perspective: 1500px;
            width: 500px;
            height: 600px;
            position: relative;
        }
        
        .magic-box {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .box-face {
            position: absolute;
            transition: all 0.8s ease;
            cursor: pointer;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }
        
        .front { 
            background: linear-gradient(145deg, #ff6b9d, #c44569);
            transform: translateZ(250px);
        }
        
        .back { 
            background: linear-gradient(145deg, #a8e6cf, #88d8a3);
            transform: translateZ(-250px) rotateY(180deg);
        }
        
        .right { 
            background: linear-gradient(145deg, #ffd93d, #ff8c42);
            transform: rotateY(90deg) translateZ(250px);
            width: 500px;
            left: -250px;
        }
        
        .left { 
            background: linear-gradient(145deg, #ff9ff3, #f368e0);
            transform: rotateY(-90deg) translateZ(250px);
            width: 500px;
            left: 250px;
        }
        
        .top { 
            background: linear-gradient(145deg, #a55eea, #4facfe);
            transform: rotateX(90deg) translateZ(300px);
            height: 500px;
            top: -300px;
        }
        
        .bottom { 
            background: linear-gradient(145deg, #f093fb, #f5576c);
            transform: rotateX(-90deg) translateZ(300px);
            height: 500px;
            top: 300px;
        }
        
        .box-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.8), transparent 70%);
            border-radius: 45px;
            z-index: -1;
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .box-glow.active {
            opacity: 1;
            animation: glowPulse 2s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .box-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .box-label:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        /* Reveal content */
        .content-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 1s ease;
            z-index: 100;
            padding: 40px;
            text-align: center;
            color: white;
        }
        
        .content-reveal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .nelaa-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(4rem, 12vw, 8rem);
            background: linear-gradient(45deg, #ff6b9d, #ffd93d, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            animation: nameGlow 2s ease-in-out infinite alternate;
            text-shadow: none;
        }
        
        @keyframes nameGlow {
            from { filter: drop-shadow(0 0 20px #ff6b9d); }
            to { filter: drop-shadow(0 0 30px #ffd93d); }
        }
        
        .birthday-text {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 600;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }
        
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            width: 100%;
            margin-top: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }
        
        .photo-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        
        .photo-item:hover {
            transform: translateY(-15px) scale(1.05);
        }
        
        .photo-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        
        .photo-item:hover img {
            transform: scale(1.1);
        }
        
        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
            padding: 25px;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }
        
        .photo-item:hover .photo-overlay {
            transform: translateY(0);
        }
        
        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.5s ease 1.5s forwards;
        }
        
        .close-btn:hover {
            background: white;
            color: #e73c7e;
            transform: scale(1.1);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .magic-container {
                width: 90vw;
                height: 70vh;
            }
            
            .photo-gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="magic-container">
        <div class="magic-box" id="magicBox">
            <div class="box-glow"></div>
            
            <div class="box-face front">
                <div class="box-label" data-face="front">
                    <div style="font-size: 1.2em; margin-bottom: 10px;">✨</div>
                    <div>NELAA</div>
                    <div style="font-size: 1.1em; opacity: 0.9;">20</div>
                </div>
            </div>
            
            <div class="box-face back">
                <div class="box-label" data-face="back">HAPPY BIRTHDAY</div>
            </div>
            
            <div class="box-face right">
                <div class="box-label" data-face="right">MAGIC BOX</div>
            </div>
            
            <div class="box-face left">
                <div class="box-label" data-face="left">SURPRISE!</div>
            </div>
            
            <div class="box-face top">
                <div class="box-label" data-face="top">🎂</div>
            </div>
            
            <div class="box-face bottom">
                <div class="box-label" data-face="bottom">CLICK ME</div>
            </div>
        </div>
    </div>
    
    <div class="content-reveal" id="contentReveal">
        <button class="close-btn" id="closeBtn">✕</button>
        
        <div class="nelaa-name">Nelaa</div>
        <div class="birthday-text">Happy 20th Birthday! ✨</div>
        
        <div class="photo-gallery">
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1494790108755-2616b612b786?w=800&h=600&fit=crop" alt="Nelaa">
                <div class="photo-overlay">
                    <div style="font-size: 1.3em; font-weight: 600;">Beautiful Smile</div>
                    <div style="opacity: 0.9;">Your happiness is contagious 💕</div>
                </div>
            </div>
            
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=600&fit=crop" alt="Nelaa">
                <div class="photo-overlay">
                    <div style="font-size: 1.3em; font-weight: 600;">20 Years Young</div>
                    <div style="opacity: 0.9;">Forever young at heart ✨</div>
                </div>
            </div>
            
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1524504388940-7b8a6c5e8b53?w=800&h=600&fit=crop" alt="Nelaa">
                <div class="photo-overlay">
                    <div style="font-size: 1.3em; font-weight: 600;">Adventure Time</div>
                    <div style="opacity: 0.9;">Life is better with you 🌟</div>
                </div>
            </div>
            
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1558618047-3c8c76bbb17e?w=800&h=600&fit=crop" alt="Nelaa">
                <div class="photo-overlay">
                    <div style="font-size: 1.3em; font-weight: 600;">Elegant Queen</div>
                    <div style="opacity: 0.9;">You shine wherever you go 👑</div>
                </div>
            </div>
            
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&h=600&fit=crop" alt="Nelaa">
                <div class="photo-overlay">
                    <div style="font-size: 1.3em; font-weight: 600;">Star of the Day</div>
                    <div style="opacity: 0.9;">Today's all about you! 🎉</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const magicBox = document.getElementById('magicBox');
        const contentReveal = document.getElementById('contentReveal');
        const closeBtn = document.getElementById('closeBtn');
        const particles = document.getElementById('particles');
        const boxFaces = document.querySelectorAll('.box-label');
        
        // Click any face to open
        boxFaces.forEach(face => {
            face.addEventListener('click', openMagicBox);
        });
        
        function openMagicBox() {
            // Box explosion animation
            magicBox.style.transform = 'rotateX(360deg) rotateY(360deg) rotateZ(360deg) scale(0.1)';
            
            // Glow effect
            document.querySelector('.box-glow').classList.add('active');
            
            // Particles explosion
            createParticlesExplosion();
            
            // Show content
            setTimeout(() => {
                contentReveal.classList.add('active');
            }, 1200);
        }
        
        closeBtn.addEventListener('click', () => {
            contentReveal.classList.remove('active');
            setTimeout(() => {
                location.reload();
            }, 800);
        });
        
        // Particles explosion
        function createParticlesExplosion() {
            for (let i = 0; i < 200; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                    particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    particles.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 5000);
                }, i * 10);
            }
        }
        
        // Continuous floating particles
        setInterval(() => {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.background = `hsl(${Math.random() * 360}, 70%, ${Math.random() * 50 + 50}%)`;
            particles.appendChild(particle);
            setTimeout(() => particle.remove(), 6000);
        }, 300);
        
        // Photo zoom effect
        document.querySelectorAll('.photo-item').forEach(item => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                const fullImg = document.createElement('img');
                fullImg.src = img.src.replace('800&h=600', '1200');
                fullImg.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) scale(0.8);
                    width: 90vw;
                    max-width: 700px;
                    height: auto;
                    border-radius: 20px;
                    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
                    z-index: 1000;
                    cursor: zoom-out;
                    transition: transform 0.5s ease;
                `;
                document.body.appendChild(fullImg);
                
                fullImg.onclick = () => {
                    fullImg.style.transform = 'translate(-50%, -50%) scale(0.8)';
                    setTimeout(() => fullImg.remove(), 500);
                };
                
                setTimeout(() => fullImg.style.transform = 'translate(-50%, -50%) scale(1)', 10);
            });
        });
    </script>
</body>
</html>
