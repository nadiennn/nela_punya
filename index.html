<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JuwbelTube</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
      overflow-x:hidden;
    }

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-thumb{
      background:#303030;
      border-radius:20px;
    }

    .navbar{
      width:100%;
      height:65px;
      background:#0f0f0f;
      border-bottom:1px solid #272727;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .nav-left{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .menu-btn{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .menu-btn:hover{
      background:#272727;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:24px;
      font-weight:700;
    }

    .yt-icon{
      width:36px;
      height:26px;
      background:#ff0000;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .search-box{
      width:45%;
      display:flex;
      align-items:center;
    }

    .search-box input{
      width:100%;
      padding:12px 18px;
      border:none;
      outline:none;
      background:#121212;
      color:white;
      border:1px solid #303030;
      border-radius:40px 0 0 40px;
    }

    .search-box button{
      width:70px;
      height:45px;
      border:none;
      background:#222;
      color:white;
      border-radius:0 40px 40px 0;
      border:1px solid #303030;
      cursor:pointer;
    }

    .nav-right{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .nav-icon{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .nav-icon:hover{
      background:#272727;
    }

    .profile{
      width:38px;
      height:38px;
      border-radius:50%;
      overflow:hidden;
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .container{
      display:flex;
    }

    .sidebar{
      width:240px;
      height:calc(100vh - 65px);
      position:sticky;
      top:65px;
      padding:15px;
    }

    .sidebar-item{
      display:flex;
      align-items:center;
      gap:18px;
      padding:14px;
      border-radius:14px;
      cursor:pointer;
      transition:0.3s;
      margin-bottom:5px;
    }

    .sidebar-item:hover{
      background:#272727;
    }

    .active{
      background:#272727;
    }

    .main{
      flex:1;
      padding:20px;
    }

    .category{
      display:flex;
      gap:12px;
      overflow-x:auto;
      margin-bottom:25px;
    }

    .category button{
      border:none;
      padding:10px 18px;
      border-radius:10px;
      background:#272727;
      color:white;
      cursor:pointer;
      white-space:nowrap;
    }

    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:25px;
    }

    .video-card{
      cursor:pointer;
      transition:0.3s;
    }

    .video-card:hover{
      transform:translateY(-5px);
    }

    .thumbnail{
      width:100%;
      height:220px;
      border-radius:18px;
      overflow:hidden;
      position:relative;
      background:#222;
    }

    .thumbnail img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .duration{
      position:absolute;
      bottom:10px;
      right:10px;
      background:rgba(0,0,0,0.8);
      padding:4px 8px;
      border-radius:6px;
      font-size:12px;
    }

    .video-info{
      display:flex;
      gap:12px;
      margin-top:12px;
    }

    .channel-pic{
      width:42px;
      height:42px;
      border-radius:50%;
      object-fit:cover;
    }

    .video-text h3{
      font-size:16px;
      margin-bottom:5px;
      line-height:1.5;
    }

    .video-text p{
      color:#aaa;
      font-size:13px;
      line-height:1.7;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
      padding:20px;
    }

    .modal-content{
      width:90%;
      max-width:850px;
      background:#181818;
      border-radius:20px;
      overflow:hidden;
      position:relative;
    }

    .close{
      position:absolute;
      top:20px;
      right:20px;
      font-size:30px;
      cursor:pointer;
      z-index:100;
    }

    .cake-scene{
      width:100%;
      min-height:500px;
      background:#111;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    .cake-wrapper{
      position:relative;
      width:320px;
      height:250px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .cake-build{
      position:absolute;
      bottom:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .candles{
      display:flex;
      gap:25px;
      margin-bottom:-5px;
      opacity:0;
      animation:candleShow 1s forwards 5s;
    }

    .candle{
      width:16px;
      height:70px;
      border-radius:10px;
      background:repeating-linear-gradient(
      45deg,
      #fff,
      #fff 6px,
      #ff4fa3 6px,
      #ff4fa3 12px
      );
      position:relative;
    }

    .flame{
      width:22px;
      height:35px;
      background:radial-gradient(circle,#fff6a9,#ff9900);
      border-radius:50%;
      position:absolute;
      top:-30px;
      left:50%;
      transform:translateX(-50%);
      animation:flicker 0.3s infinite alternate;
      box-shadow:0 0 25px #ffcc33;
    }

    .cake-layer{
      border-radius:20px;
      background:#ff8fc7;
      box-shadow:0 10px 20px rgba(255,105,180,0.3);
      opacity:0;
    }

    .top-layer{
      width:140px;
      height:38px;
      animation:showTop 1s forwards 4s;
    }

    .middle-layer{
      width:170px;
      height:45px;
      animation:showMiddle 1s forwards 3s;
    }

    .bottom-layer{
      width:200px;
      height:55px;
      animation:showBottom 1s forwards 2s;
    }

    .cream{
      background:white;
      height:14px;
      border-radius:20px;
      opacity:0;
    }

    .cream1{
      width:185px;
      animation:showCream1 1s forwards 2.5s;
    }

    .cream2{
      width:155px;
      animation:showCream2 1s forwards 3.5s;
    }

    .birthday-title{
      margin-top:40px;
      font-size:48px;
      color:#ffb6d9;
      font-family:'Great Vibes',cursive;
      opacity:0;
      animation:fadeText 1.5s forwards 5.8s;
    }

    .birthday-desc{
      margin-top:10px;
      color:#ddd;
      text-align:center;
      max-width:500px;
      line-height:1.8;
      padding:0 20px;
      opacity:0;
      animation:fadeText 1.5s forwards 6.3s;
    }

    @keyframes flicker{
      from{
        transform:translateX(-50%) scale(1);
      }
      to{
        transform:translateX(-50%) scale(1.1);
      }
    }

    @keyframes candleShow{
      to{
        opacity:1;
      }
    }

    @keyframes showTop{
      to{
        opacity:1;
      }
    }

    @keyframes showMiddle{
      to{
        opacity:1;
      }
    }

    @keyframes showBottom{
      to{
        opacity:1;
      }
    }

    @keyframes showCream1{
      to{
        opacity:1;
      }
    }

    @keyframes showCream2{
      to{
        opacity:1;
      }
    }

    @keyframes fadeText{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:900px){

      .sidebar{
        display:none;
      }

      .search-box{
        width:60%;
      }

      .video-grid{
        grid-template-columns:1fr;
      }

    }

  </style>

</head>

<body>

  <audio id="bgMusic" autoplay loop>
    <source src="adrianne lenker - anything.mp3" type="audio/mpeg">
  </audio>

  <nav class="navbar">

    <div class="nav-left">

      <div class="menu-btn">
        <i class="fa-solid fa-bars"></i>
      </div>

      <div class="logo">

        <div class="yt-icon">
          <i class="fa-solid fa-play"></i>
        </div>

        JuwbelTube

      </div>

    </div>

    <div class="search-box">

      <input type="text" placeholder="Search">

      <button>
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

    </div>

    <div class="nav-right">

      <div class="nav-icon">
        <i class="fa-solid fa-video"></i>
      </div>

      <div class="nav-icon">
        <i class="fa-regular fa-bell"></i>
      </div>

      <div class="profile">
        <img src="profil yt.jpeg">
      </div>

    </div>

  </nav>

  <div class="container">

    <aside class="sidebar">

      <div class="sidebar-item active">
        <i class="fa-solid fa-house"></i>
        Home
      </div>

      <div class="sidebar-item">
        <i class="fa-solid fa-film"></i>
        Shorts
      </div>

      <div class="sidebar-item">
        <i class="fa-solid fa-heart"></i>
        Favorites
      </div>

      <div class="sidebar-item">
        <i class="fa-solid fa-clock-rotate-left"></i>
        History
      </div>

    </aside>

    <main class="main">

      <div class="category">

        <button>All</button>
        <button>Music</button>
        <button>Vlog</button>
        <button>Memories</button>
        <button>Special</button>

      </div>

      <section class="video-grid">

        <div class="video-card" onclick="openModal()">

          <div class="thumbnail">

            <img src="bg bird.png">

            <div class="duration">
              6:27
            </div>

          </div>

          <div class="video-info">

            <img class="channel-pic" src="profil yt.jpeg">

            <div class="video-text">

              <h3>
                Ucapan Untuk Nelaaa 💖
              </h3>

              <p>
                JuwbelTube ✓
              </p>

              <p>
                2,7 jt x ditonton • 1 hari lalu
              </p>

            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <div class="modal" id="modal">

    <div class="modal-content">

      <span class="close" onclick="closeModal()">×</span>

      <div class="cake-scene" id="cakeScene">

        <div class="cake-wrapper">

          <div class="cake-build">

            <div class="candles">

              <div class="candle">
                <div class="flame"></div>
              </div>

              <div class="candle">
                <div class="flame"></div>
              </div>

              <div class="candle">
                <div class="flame"></div>
              </div>

            </div>

            <div class="cake-layer top-layer"></div>
            <div class="cream cream2"></div>

            <div class="cake-layer middle-layer"></div>
            <div class="cream cream1"></div>

            <div class="cake-layer bottom-layer"></div>

          </div>

        </div>

        <h1 class="birthday-title">
          Happy Birthday Nelaaa 💖
        </h1>

        <p class="birthday-desc">

          Thank you for being part of these beautiful memories.
          I hope happiness, love, success, and peaceful days
          always follow you wherever you go ✨

        </p>

      </div>

    </div>

  </div>

  <script>

    function openModal(){

      document.getElementById('modal').style.display='flex';

      document.getElementById('cakeScene').style.display='flex';

    }

    function closeModal(){

      document.getElementById('modal').style.display='none';

    }

    document.addEventListener('click', () => {

      const music = document.getElementById('bgMusic');

      music.play();

    });

  </script>

</body>
</html>
