<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelaa 20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&family=Dancing+Script:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, 
                #667eea 0%, 
                #764ba2 30%, 
                #f093fb 70%, 
                #f5576c 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,182,193,0.4) 0%, transparent 50%);
            animation: bgFloat 12s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes bgFloat {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-15px); }
        }
        
        .landing-container {
            text-align: center;
            max-width: 900px;
            padding: 40px;
            position: relative;
            z-index: 2;
        }
        
        /* Hero section - staggered animation */
        .hero-content {
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 1.5s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .birthday-badge {
            display: inline-block;
            background: linear-gradient(45deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            padding: 15px 35px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation-delay: 0.3s;
            animation-fill-mode: both;
        }
        
        .birthday-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 6vw, 4.5rem);
            background: linear-gradient(135deg, #fff, #f8f9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 0 5px 20px rgba(255,255,255,0.3);
        }
        
        .birthday-age {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b9d, #ffd93d, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            animation: pulseGlow 2s ease-in-out infinite;
            text-shadow: 0 10px 30px rgba(255,107,157,0.5);
        }
        
        @keyframes pulseGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(255,107,157,0.6));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(255,107,157,0.9));
                transform: scale(1.03);
            }
        }
        
        .name-reveal {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.5rem, 8vw, 6rem);
            color: #fff;
            font-weight: 700;
            margin: 20px 0;
            opacity: 0;
            transform: translateY(30px);
            animation: nameSlide 1s ease 1.2s forwards;
            text-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        @keyframes nameSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* CTA Button */
        .cta-section {
            margin-top: 50px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 1.8s forwards;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 20px 40px rgba(255,107,157,0.4);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }
        
        .cta-button:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 30px 60px rgba(255,107,157,0.6);
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        
        .cta-button:hover::before {
            left: 100%;
        }
        
        /* Floating elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .float-item {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: floatUp 8s linear infinite;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Subtext */
        .subtext {
            margin-top: 25px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
            opacity: 0;
            animation: fadeInUp 1s ease 2.2s forwards;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .landing-container {
                padding: 20px;
            }
            
            .birthday-badge {
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements" id="floats"></div>
    
    <div class="landing-container">
        <div class="hero-content">
            <div class="birthday-badge">
                <div class="birthday-text">Happy Birthday</div>
                <div class="birthday-age">20</div>
            </div>
            
            <div class="name-reveal">Nelaa</div>
            
            <div class="cta-section">
                <a href="#" class="cta-button" onclick="revealSurprise()">
                    🎉 Open Birthday Gift
                </a>
                <div class="subtext">
                    A special day for the most amazing girl ✨
                </div>
            </div>
        </div>
    </div>

    <script>
        // Floating emojis
        const emojis = ['🎂', '💖', '✨', '🎈', '🌟', '🎁', '💕'];
        const floatsContainer = document.getElementById('floats');
        
        setInterval(() => {
            const float = document.createElement('div');
            float.className = 'float-item';
            float.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            float.style.left = Math.random() * 100 + 'vw';
            float.style.animationDuration = (Math.random() * 4 + 6) + 's';
            floatsContainer.appendChild(float);
            
            setTimeout(() => float.remove(), 8000);
        }, 1000);

        // Reveal surprise (modal or redirect)
        function revealSurprise() {
            // Animated explosion
            document.body.style.transform = 'scale(0.95)';
            setTimeout(() => {
                document.body.innerHTML = `
                <div style="
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    text-align: center;
                    background: rgba(0,0,0,0.9);
                    padding: 60px;
                    border-radius: 30px;
                    max-width: 90%;
                    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255,255,255,0.2);
                ">
                    <div style="font-size: 6rem; margin-bottom: 30px; animation: bounce 1s infinite;">🎉</div>
                    <h1 style="
                        font-family: 'Dancing Script', cursive;
                        font-size: 5rem;
                        background: linear-gradient(45deg, #ff6b9d, #ffd93d);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        margin-bottom: 20px;
                    ">SELAMAT ULANG TAHUN!</h1>
                    <div style="
                        font-size: 1.6rem;
                        line-height: 1.6;
                        max-width: 600px;
                        margin: 0 auto 40px;
                        opacity: 0.95;
                    ">
                        Nelaa, 20 tahun penuh keajaiban dan senyuman yang mencerahkan dunia. 
                        Semoga tahun ini membawa kebahagiaan tak terbatas, cinta yang tulus, 
                        dan semua mimpi menjadi kenyataan. Kamu luar biasa! 💖✨
                    </div>
                    <div style="font-size: 1.1rem; opacity: 0.8;">
                        Terima kasih sudah jadi Nelaa yang spesial 💕
                    </div>
                    <button onclick="location.reload()" style="
                        background: linear-gradient(135deg, #ff6b9d, #c44569);
                        color: white;
                        border: none;
                        padding: 15px 40px;
                        border-radius: 30px;
                        font-size: 1.1rem;
                        font-weight: 600;
                        cursor: pointer;
                        margin-top: 30px;
                        box-shadow: 0 15px 30px rgba(255,107,157,0.4);
                        transition: all 0.3s ease;
                    " onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
                        🎁 Lihat Hadiah Lain
                    </button>
                </div>
                `;
            }, 300);
        }
    </script>
</body>
</html>
